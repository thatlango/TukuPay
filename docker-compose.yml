services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tukupay
      POSTGRES_USER: tukupay
      POSTGRES_PASSWORD: tukupay
    ports:
      - '5432:5432'
    volumes:
      - tukupay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tukupay -d tukupay']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tukupay_pgdata:
