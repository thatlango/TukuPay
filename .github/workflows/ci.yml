name: TukuPay CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tukupay
          POSTGRES_PASSWORD: tukupay
          POSTGRES_DB: tukupay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tukupay -d tukupay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://tukupay:tukupay@127.0.0.1:5432/tukupay
      TUKUPAY_FINANCIAL_ENVIRONMENT: simulator
      TUKUPAY_SIMULATOR_ENABLED: "true"
      TUKUPAY_SERVICE_TOKEN: ci-admin-token-0123456789
      TUKUPAY_E2E_KELA_TOKEN: ci-kela-token-0123456789
      TUKUPAY_SERVICE_TOKENS_JSON: '{"kela":{"token":"ci-kela-token-0123456789","scopes":["payments:create","payments:read","payments:refresh"]}}'
      RECONCILIATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - name: Bind disposable simulator database
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -v environment=simulator -f database/checks/bind_empty_environment.sql
      - run: pnpm build
      - name: Configure independent simulator approver
        run: |
          node -e 'const fs=require("node:fs");const value=require("node:crypto").randomBytes(24).toString("hex");const registry=JSON.parse(process.env.TUKUPAY_SERVICE_TOKENS_JSON);registry.finance={token:value,scopes:["payouts:approve","products:kela"]};fs.appendFileSync(process.env.GITHUB_ENV,"TUKUPAY_E2E_APPROVER_TOKEN="+value+"\nTUKUPAY_SERVICE_TOKENS_JSON="+JSON.stringify(registry)+"\n")'
      - name: Start API
        run: |
          pnpm --filter @tuku/pay-api start > /tmp/tukupay-api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health && exit 0
            sleep 1
          done
          cat /tmp/tukupay-api.log
          exit 1
      - name: Simulator end-to-end
        run: node apps/api/scripts/e2e-simulator.mjs
      - name: Verify simulator journal and payout invariants
        run: |
          psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -f database/checks/payment_integrity.sql > /tmp/tukupay-integrity.txt
          if test -s /tmp/tukupay-integrity.txt; then
            cat /tmp/tukupay-integrity.txt
            exit 1
          fi

  financial-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python intelligence
        run: |
          python3 -m unittest discover -s python/intelligence -p 'test_*.py' -v
          python3 python/intelligence/cli.py python/intelligence/fixtures/sample.json --statements python/intelligence/fixtures/statement.csv
      - name: Rust financial kernel
        run: |
          rustc --version
          cargo test --manifest-path crates/financial-kernel/Cargo.toml --locked --offline
          cargo build --manifest-path crates/financial-kernel/Cargo.toml --locked --offline --bin shadow --bin journal_audit
          crates/financial-kernel/target/debug/journal_audit < contracts/financial/journals.tsv
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - name: Intelligence report validation
        run: |
          node --test scripts/intelligence-report.test.mjs
          node --check scripts/ops-workspace.mjs
      - name: Financial kernel parity
        run: node scripts/compare-financial-kernel.mjs crates/financial-kernel/target/debug/shadow
